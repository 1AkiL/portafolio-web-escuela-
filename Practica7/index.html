<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema Admin</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    
    <style>
    /* Un pequeño truco para que el menú ocupe toda la altura */
        .altura-total { height: 100vh; }
    </style>
</head>
<body>
<div id="app">
    <!-- AQUÍ ESCRIBIREMOS TODO EL CÓDIGO -->
    <div class="container-fluid">
        <div class="row">
    <!-- COLUMNA 1: MENÚ LATERAL (2 columnas de ancho) -->
            <div class="col-md-2 bg-dark text-white altura-total p-3">
                <h4> Mi Sistema</h4>
                <hr>
                <ul class="nav flex-column">
                    <li class="nav-item">
                        <a class="nav-link text-white active" href="#"> Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#"> Usuarios</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link text-white-50" href="#"> Configuración</a>
                    </li>
                </ul>
            </div>
    <!-- COLUMNA 2: CONTENIDO (10 columnas de ancho) -->
            <div class="col-md-10 bg-light p-4">
                <h2>Resumen del Mes</h2>
                <!-- Abrimos una nueva fila DENTRO de la columna principal -->
                <div class="row mt-4">
                <!-- Tarjeta 1 -->
                <div class="col-md-4">
                    <div class="card text-white bg-primary mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Usuarios Totales</h5>
                            <p class="card-text fs-2">1,250</p>
                            
                        </div>
                    </div>
                </div>
                <!-- Tarjeta 2 -->
                <div class="col-md-4">
                    <div class="card text-white bg-success mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Ventas</h5>
                            
                            <p class="card-text fs-2">$45,000</p>
                        </div>
                    </div>
                </div>
                <!-- Tarjeta 3 -->
                <div class="col-md-4">
                    <div class="card text-white bg-danger mb-3">
                        <div class="card-body">
                            <h5 class="card-title">Errores</h5>
                            <p class="card-text fs-2">3</p>
                        </div>
                    </div>
                </div>
                <h3 class="mt-5">Lista de Usuarios Recientes</h3>
                <!-- Botón que abre el modal -->
                <button type="button" class="btn btn-primary mb-3" data-bs-toggle="modal" data-bs-target="#modalUsuario">
                    Nuevo Usuario
                </button>
                <table class="table table-striped table-hover shadow-sm">
                    <thead class="table-dark">
                        <tr>
                            <th>#</th>
                            <th>Nombre</th>
                            <th>Correo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
<!-- Vue repetirá este 'tr' por cada usuario en nuestra lista -->
                        <tr v-for="user in usuarios" :key="user.id">
                            <td>{{ user.id }}</td>
                            <td>{{ user.nombre }}</td>
                            <td>{{ user.correo }}</td>
                            <td><span class="badge bg-primary">{{ user.estado }}</span></td>
                            <td>
                                <button class="btn btn-sm btn-primary">Editar</button>
                            </td>
                        </tr>
                    </tbody>
                    </tr>
                </table>
            </div>
        </div>
    </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Modal (Ventana Emergente) -->
    <div class="modal fade" id="modalUsuario" tabindex="-1" aria-hidden="true">
        <div class="modal-content">
            <div class="modal-dialog">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar Nuevo Usuario</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Nombre Completo</label>
                            <input type="text" class="form-control" v-model="nuevoNombre" placeholder="Nombre">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Correo Electrónico</label>
                            <input type="email" class="form-control" v-model="nuevoCorreo" placeholder="Correo">
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-primary" @click="guardarUsuario" data-bs-dismiss="modal">Guardar</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
        const { createApp } = Vue;
        createApp({
        // 1. DATA: Aquí guardamos la memoria (Las variables)
        data() {
            return {
                nuevoNombre: '', // Lo que el usuario escribe
                nuevoCorreo: '',
                // Nuestra base de datos simulada (Un Arreglo)
                usuarios: [
                    { id: 1, nombre: 'Juan Pérez', correo: 'juan@gmail.com', estado: 'Activo' },
                    { id: 2, nombre: 'Ana Gómez', correo: 'ana@hotmail.com', estado: 'Pendiente' }
                ]
            }
        },
        // 2. METHODS: Aquí van las funciones
        methods: {
            guardarUsuario() {
                if(this.nuevoNombre === '' || this.nuevoCorreo === '') {
                    alert("Llene los campos ingeniero");
                    return;
                }
            // ¡Solo empujamos el dato a la lista! Vue hace el resto visualmente.
            this.usuarios.push({
                id: this.usuarios.length + 1,
                nombre: this.nuevoNombre,
                correo: this.nuevoCorreo,
                estado: 'Nuevo'
            });
            // Limpiamos variables
            this.nuevoNombre = '';
            this.nuevoCorreo = '';
        }
    }
    }).mount('#app'); // Conectamos el cerebro al <div id="app">
    </script>
</body>
</html>
