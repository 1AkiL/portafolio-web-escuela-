<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acerca del Sistema</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
    <div id="sidebar-desktop"></div>
    <div class="container">
        <h1>Acerca del Sistema</h1>
        <p class="lead">Sistema de Administración de Usuarios v1.0</p>
        <p>Desarrollado con Python, Flask y Bootstrap.</p>
        <a href="/" class="btn btn-primary">Regresar al Dashboard</a>
    </div>
    <script>
        fetch('/sidebar')
            .then(res => res.text())
            .then(data => {
            document.getElementById('sidebar-desktop').innerHTML = data;
        });
    </script>
</body>
</html>
