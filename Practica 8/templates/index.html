<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
 <div id="sidebar-desktop"></div>
  <table class="table table-striped table-hover shadow-sm">
    <thead class="table-dark">
      <tr>
        <th>Id</th>
        <th>Nombre</th>
        <th>Correo Electronico</th>
        <th>Estado</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
    <!-- Jinja2: por cada usuario en la lista que mandó Flask, dibuja una fila -->
    {% for user in usuarios %}
    <tr>
        <td>{{ user.id }}</td>
        <td>{{ user.nombre }}</td>
        <td>{{ user.correo }}</td>
        <td>
            <span class="badge bg-primary">{{ user.estado }}</span>
        </td>
        <td>
            <button class="btn btn-sm btn-primary">Editar</button>
        </td>
    </tr>
    {% endfor %}
</tbody>
</table>
<script>
  fetch('/sidebar')
    .then(res => res.text())
    .then(data => {
      document.getElementById('sidebar-desktop').innerHTML = data;});
</script>
</body>
</html>
